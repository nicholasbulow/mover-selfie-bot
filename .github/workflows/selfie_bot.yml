name: Mover Selfie Bot

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "0 = today, 1 = tomorrow"
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
      customer_id:
        description: "Specific customer ID (leave empty to run all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-selfie-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run selfie bot
        env:
          MOVER_EMAIL:    ${{ secrets.MOVER_EMAIL }}
          MOVER_PASSWORD: ${{ secrets.MOVER_PASSWORD }}
          CUSTOMER_ID:    ${{ github.event.inputs.customer_id }}
        run: python selfie_bot.py --offset ${{ github.event.inputs.offset }}
